<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img">
  <title>The three Start settings for a PowerPoint animation: On Click, With Previous and After Previous</title>
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .cap  { font-size: 10px; fill: #9a9a92; letter-spacing: 0.10em; }
      .name { font-size: 13.5px; font-weight: 700; fill: #1a1a1a; }
      .hint { font-size: 10.5px; fill: #8a8a82; }
      .inbl { font-size: 11px; fill: #ffffff; font-weight: 600; }
      .inbg { font-size: 11px; fill: #7a7a72; }
      .note { font-size: 11.5px; fill: #5c5c5c; }
      .warn { font-size: 11.5px; fill: #a8431f; }
    </style>
  </defs>

  <rect width="720" height="344" fill="#ffffff"/>
  <text class="t cap" x="360" y="26" text-anchor="middle">ANIMATIONS → START</text>

  <!-- ============ row 1: On Click ============ -->
  <text class="t name" x="24" y="98">On Click</text>
  <text class="t hint" x="24" y="116">waits for you</text>

  <rect x="190" y="72" width="360" height="56" rx="6" fill="#fafaf8" stroke="#eeeeea"/>

  <!-- click marker -->
  <path d="M232 92 l0 24 l7 -7 l5 12 l6 -3 l-5 -12 l10 -1 z" fill="#c43e1c"/>
  <text class="t hint" x="232" y="140" text-anchor="middle" fill="#c43e1c" font-size="9.5">click</text>

  <rect x="266" y="84" width="112" height="32" rx="5" fill="#c43e1c"/>
  <text class="t inbl" x="322" y="104" text-anchor="middle">effect plays</text>

  <text class="t note" x="576" y="96">You control the pace.</text>
  <text class="t note" x="576" y="113">The default to use.</text>

  <!-- ============ row 2: With Previous ============ -->
  <line x1="24" y1="158" x2="696" y2="158" stroke="#f0f0ec"/>

  <text class="t name" x="24" y="200">With Previous</text>
  <text class="t hint" x="24" y="218">runs alongside</text>

  <rect x="190" y="174" width="360" height="56" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <rect x="214" y="186" width="88" height="32" rx="5" fill="#e6e4de"/>
  <text class="t inbg" x="258" y="206" text-anchor="middle">previous</text>
  <rect x="302" y="186" width="112" height="32" rx="5" fill="#c43e1c"/>
  <text class="t inbl" x="358" y="206" text-anchor="middle">effect plays</text>

  <text class="t note" x="576" y="198">Both start together.</text>
  <text class="t note" x="576" y="215">Two arrive as one.</text>

  <!-- ============ row 3: After Previous ============ -->
  <line x1="24" y1="260" x2="696" y2="260" stroke="#f0f0ec"/>

  <text class="t name" x="24" y="302">After Previous</text>
  <text class="t hint" x="24" y="320">runs automatically</text>

  <rect x="190" y="276" width="360" height="56" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <rect x="214" y="288" width="88" height="32" rx="5" fill="#e6e4de"/>
  <text class="t inbg" x="258" y="308" text-anchor="middle">previous</text>
  <rect x="326" y="288" width="112" height="32" rx="5" fill="#c43e1c"/>
  <text class="t inbl" x="382" y="308" text-anchor="middle">effect plays</text>
  <path d="M306 304 l14 0 M314 300 l5 4 l-5 4" fill="none" stroke="#c43e1c" stroke-width="1.6"/>

  <text class="t warn" x="576" y="300">Fires without you.</text>
  <text class="t warn" x="576" y="317">The usual culprit.</text>
</svg>
