<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img">
  <title>Five short notes lines in the Notes pane, with the number and the ask set in bold</title>
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .tab { font-size: 12px; fill: #8a8a82; }
      .tab-on { font-size: 12px; fill: #c43e1c; font-weight: 600; }
      .lbl { font-size: 11px; fill: #5c5c5c; }
      .grp { font-size: 9.5px; fill: #9a9a92; letter-spacing: 0.04em; }
      .btn { fill: #f4f4f1; stroke: #e3e3df; }
      .bar { fill: #eceae6; }
      .cap { font-size: 9px; fill: #5c5c5c; }
      .note { font-size: 11.5px; fill: #3a3a36; }
    </style>
  </defs>

  <rect width="720" height="470" fill="#ffffff"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="720" height="30" fill="#f2f2ef"/>
  <circle cx="18" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="34" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="50" cy="15" r="4.5" fill="#d8d8d2"/>
  <text class="t lbl" x="360" y="19" text-anchor="middle" font-size="10">Q3 Review - PowerPoint</text>
  <line x1="0" y1="30" x2="720" y2="30" stroke="#e3e3df"/>

  <!-- tab row -->
  <rect x="0" y="30" width="720" height="34" fill="#fbfbf9"/>
  <text class="t tab"    x="24"  y="51">File</text>
  <text class="t tab-on" x="74"  y="51">Home</text>
  <text class="t tab"    x="130" y="51">Insert</text>
  <text class="t tab"    x="186" y="51">Draw</text>
  <text class="t tab"    x="238" y="51">Design</text>
  <text class="t tab"    x="302" y="51">Transitions</text>
  <text class="t tab"    x="390" y="51">Animations</text>
  <text class="t tab"    x="478" y="51">Slide Show</text>
  <text class="t tab"    x="566" y="51">Review</text>
  <text class="t tab"    x="632" y="51">View</text>
  <rect x="70" y="60" width="38" height="3" rx="1.5" fill="#c43e1c"/>
  <line x1="0" y1="64" x2="720" y2="64" stroke="#e3e3df"/>

  <!-- ribbon (Home) -->
  <rect x="0" y="64" width="720" height="60" fill="#ffffff"/>
  <rect class="btn" x="24"  y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="66"  y="72" width="34" height="26" rx="4"/>
  <rect class="bar" x="24"  y="102" width="76" height="6" rx="3"/>
  <text class="t grp" x="24" y="118">CLIPBOARD</text>
  <line x1="118" y1="70" x2="118" y2="118" stroke="#e3e3df"/>

  <rect class="btn" x="134" y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="176" y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="218" y="72" width="34" height="26" rx="4"/>
  <rect class="bar" x="134" y="102" width="118" height="6" rx="3"/>
  <text class="t grp" x="134" y="118">SLIDES</text>
  <line x1="266" y1="70" x2="266" y2="118" stroke="#e3e3df"/>

  <rect class="btn" x="286" y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="328" y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="370" y="72" width="34" height="26" rx="4"/>
  <rect class="bar" x="286" y="102" width="118" height="6" rx="3"/>
  <text class="t grp" x="286" y="118">FONT</text>
  <line x1="418" y1="70" x2="418" y2="118" stroke="#e3e3df"/>

  <rect class="btn" x="438" y="72" width="34" height="26" rx="4"/>
  <rect class="btn" x="480" y="72" width="34" height="26" rx="4"/>
  <rect class="bar" x="438" y="102" width="76" height="6" rx="3"/>
  <text class="t grp" x="438" y="118">PARAGRAPH</text>

  <!-- thumbnail strip -->
  <rect x="0" y="124" width="96" height="310" fill="#f7f7f5"/>
  <line x1="96" y1="124" x2="96" y2="434" stroke="#e3e3df"/>
  <rect x="14" y="136" width="68" height="38" rx="2" fill="#ffffff" stroke="#e3e3df"/>
  <rect x="14" y="182" width="68" height="38" rx="2" fill="#ffffff" stroke="#c43e1c" stroke-width="1.6"/>
  <rect x="14" y="228" width="68" height="38" rx="2" fill="#ffffff" stroke="#e3e3df"/>

  <!-- slide -->
  <rect x="230" y="136" width="356" height="200" fill="#ffffff" stroke="#e3e3df"/>
  <text class="t" x="266" y="192" font-size="17" fill="#3a3a36" font-weight="600">Three numbers</text>
  <line x1="266" y1="206" x2="330" y2="206" stroke="#c43e1c" stroke-width="3"/>
  <circle cx="272" cy="234" r="3" fill="#c43e1c"/>
  <rect class="bar" x="284" y="230" width="180" height="7" rx="3.5"/>
  <circle cx="272" cy="262" r="3" fill="#c43e1c"/>
  <rect class="bar" x="284" y="258" width="150" height="7" rx="3.5"/>
  <circle cx="272" cy="290" r="3" fill="#c43e1c"/>
  <rect class="bar" x="284" y="286" width="196" height="7" rx="3.5"/>

  <!-- notes pane, filled -->
  <line x1="96" y1="346" x2="720" y2="346" stroke="#c9c9c2" stroke-width="1.4"/>
  <rect x="250" y="348" width="4" height="78" fill="#fdf0ec"/>
  <text class="t note" x="264" y="360">3 numbers, then the ask.</text>
  <text class="t note" x="264" y="376">Revenue up <tspan font-weight="700">42</tspan> percent — say forty-two, not four point two.</text>
  <text class="t note" x="264" y="392">Pause here. Let this one land.</text>
  <text class="t note" x="264" y="408">Next: cost, and why it is the smaller half.</text>
  <text class="t note" x="264" y="424" font-weight="700">ASK: pilot by February.</text>

  <!-- status bar -->
  <rect x="0" y="434" width="720" height="28" fill="#fbfbf9"/>
  <line x1="0" y1="434" x2="720" y2="434" stroke="#e3e3df"/>
  <text class="t cap" x="24" y="452" fill="#8a8a82">Slide 2 of 3</text>
  <rect x="600" y="436" width="58" height="24" rx="4" fill="#fdf0ec" stroke="#c43e1c" stroke-width="1.2"/>
  <text class="t cap" x="629" y="452" text-anchor="middle" fill="#c43e1c" font-weight="600">Notes</text>
  <line x1="676" y1="448" x2="706" y2="448" stroke="#d8d8d2" stroke-width="2"/>
  <circle cx="694" cy="448" r="5" fill="#ffffff" stroke="#c43e1c" stroke-width="1.4"/>
</svg>
