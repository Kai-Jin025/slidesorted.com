<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img">
  <title>PowerPoint on a Mac: the View tab with Notes highlighted, and a status bar that has no Notes button</title>
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .tab { font-size: 12px; fill: #8a8a82; }
      .tab-on { font-size: 12px; fill: #c43e1c; font-weight: 600; }
      .lbl { font-size: 11px; fill: #5c5c5c; }
      .grp { font-size: 9.5px; fill: #9a9a92; letter-spacing: 0.04em; }
      .btn { fill: #f4f4f1; stroke: #e3e3df; }
      .bar { fill: #eceae6; }
      .cap { font-size: 9px; fill: #5c5c5c; }
    </style>
  </defs>

  <rect width="720" height="236" fill="#ffffff"/>

  <!-- macOS menu bar -->
  <rect x="0" y="0" width="720" height="22" fill="#f2f2ef"/>
  <text class="t" x="18"  y="15" font-size="9" fill="#5c5c5c" font-weight="600">PowerPoint</text>
  <text class="t" x="96"  y="15" font-size="9" fill="#5c5c5c">File</text>
  <text class="t" x="122" y="15" font-size="9" fill="#5c5c5c">Edit</text>
  <text class="t" x="152" y="15" font-size="9" fill="#5c5c5c">View</text>
  <text class="t" x="184" y="15" font-size="9" fill="#5c5c5c">Insert</text>
  <text class="t" x="220" y="15" font-size="9" fill="#5c5c5c">Format</text>
  <text class="t" x="264" y="15" font-size="9" fill="#5c5c5c">Arrange</text>
  <text class="t" x="318" y="15" font-size="9" fill="#5c5c5c">Slide Show</text>
  <text class="t" x="382" y="15" font-size="9" fill="#5c5c5c">Review</text>
  <text class="t" x="426" y="15" font-size="9" fill="#5c5c5c">Tools</text>
  <text class="t" x="462" y="15" font-size="9" fill="#5c5c5c">Help</text>

  <!-- title bar -->
  <rect x="0" y="22" width="720" height="30" fill="#fbfbf9"/>
  <circle cx="22" cy="37" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="37" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="37" r="5.5" fill="#28c840"/>
  <text class="t lbl" x="360" y="41" text-anchor="middle" font-size="10">Q3 Review - PowerPoint</text>
  <line x1="0" y1="52" x2="720" y2="52" stroke="#e3e3df"/>

  <!-- tab row -->
  <rect x="0" y="52" width="720" height="34" fill="#fbfbf9"/>
  <text class="t tab"    x="24"  y="73">File</text>
  <text class="t tab"    x="74"  y="73">Home</text>
  <text class="t tab"    x="130" y="73">Insert</text>
  <text class="t tab"    x="186" y="73">Design</text>
  <text class="t tab"    x="250" y="73">Transitions</text>
  <text class="t tab"    x="338" y="73">Animations</text>
  <text class="t tab"    x="426" y="73">Slide Show</text>
  <text class="t tab"    x="514" y="73">Review</text>
  <text class="t tab-on" x="584" y="73">View</text>
  <rect x="580" y="82" width="40" height="3" rx="1.5" fill="#c43e1c"/>
  <line x1="0" y1="86" x2="720" y2="86" stroke="#e3e3df"/>

  <!-- ribbon -->
  <rect x="0" y="86" width="720" height="70" fill="#ffffff"/>

  <rect class="btn" x="24"  y="94" width="38" height="26" rx="4"/>
  <rect class="btn" x="70"  y="94" width="38" height="26" rx="4"/>
  <rect class="btn" x="116" y="94" width="38" height="26" rx="4"/>
  <rect class="btn" x="162" y="94" width="38" height="26" rx="4"/>
  <rect class="bar" x="24"  y="124" width="38" height="6" rx="3"/>
  <rect class="bar" x="70"  y="124" width="38" height="6" rx="3"/>
  <rect class="bar" x="116" y="124" width="38" height="6" rx="3"/>
  <rect class="bar" x="162" y="124" width="38" height="6" rx="3"/>
  <text class="t grp" x="24" y="146">PRESENTATION VIEWS</text>
  <line x1="212" y1="92" x2="212" y2="152" stroke="#e3e3df"/>

  <rect class="btn" x="228" y="94" width="38" height="26" rx="4"/>
  <rect class="btn" x="274" y="94" width="38" height="26" rx="4"/>
  <rect class="btn" x="320" y="94" width="38" height="26" rx="4"/>
  <rect class="bar" x="228" y="124" width="38" height="6" rx="3"/>
  <rect class="bar" x="274" y="124" width="38" height="6" rx="3"/>
  <rect class="bar" x="320" y="124" width="38" height="6" rx="3"/>
  <text class="t grp" x="228" y="146">MASTER</text>
  <line x1="370" y1="92" x2="370" y2="152" stroke="#e3e3df"/>

  <text class="t grp" x="384" y="148">SHOW</text>
  <rect class="btn" x="384" y="94" width="40" height="24" rx="4"/>
  <rect class="btn" x="432" y="94" width="40" height="24" rx="4"/>
  <rect class="btn" x="480" y="94" width="40" height="24" rx="4"/>
  <text class="t cap" x="404" y="127" text-anchor="middle">Ruler</text>
  <text class="t cap" x="452" y="127" text-anchor="middle">Gridlines</text>
  <text class="t cap" x="500" y="127" text-anchor="middle">Guides</text>

  <rect x="528" y="90" width="62" height="44" rx="6" fill="#fdf0ec" stroke="#c43e1c" stroke-width="1.2"/>
  <rect x="538" y="94" width="42" height="24" rx="4" fill="#ffffff" stroke="#c43e1c"/>
  <line x1="544" y1="101" x2="574" y2="101" stroke="#c43e1c" stroke-width="1.4"/>
  <line x1="544" y1="106" x2="568" y2="106" stroke="#c43e1c" stroke-width="1.4"/>
  <line x1="544" y1="111" x2="572" y2="111" stroke="#c43e1c" stroke-width="1.4"/>
  <text class="t cap" x="559" y="128" text-anchor="middle" fill="#c43e1c" font-weight="600">Notes</text>

  <!-- status bar: no Notes button -->
  <rect x="0" y="156" width="720" height="28" fill="#fbfbf9"/>
  <line x1="0" y1="156" x2="720" y2="156" stroke="#e3e3df"/>
  <text class="t cap" x="24" y="174" fill="#8a8a82">Slide 2 of 3</text>
  <rect class="btn" x="520" y="163" width="18" height="14" rx="2"/>
  <rect class="btn" x="544" y="163" width="18" height="14" rx="2"/>
  <rect class="btn" x="568" y="163" width="18" height="14" rx="2"/>
  <line x1="612" y1="170" x2="648" y2="170" stroke="#d8d8d2" stroke-width="2"/>
  <circle cx="636" cy="170" r="5" fill="#ffffff" stroke="#c43e1c" stroke-width="1.4"/>
  <text class="t cap" x="700" y="174" text-anchor="end" fill="#8a8a82">100%</text>

  <!-- annotation -->
  <rect x="24" y="194" width="672" height="30" rx="6" fill="#fdf0ec"/>
  <text class="t" x="360" y="213" text-anchor="middle" font-size="11.5" fill="#c43e1c">
    No Notes button on this status bar — that button is Windows-only.
  </text>
</svg>
