<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img">
  <title>Notes Master view with the body text placeholder selected, the place where the notes font is set for every slide</title>
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .tab { font-size: 12px; fill: #8a8a82; }
      .tab-on { font-size: 12px; fill: #c43e1c; font-weight: 600; }
      .lbl { font-size: 11px; fill: #5c5c5c; }
      .grp { font-size: 9.5px; fill: #9a9a92; letter-spacing: 0.04em; }
      .btn { fill: #f4f4f1; stroke: #e3e3df; }
      .bar { fill: #eceae6; }
      .cap { font-size: 9px; fill: #5c5c5c; }
    </style>
  </defs>

  <rect width="720" height="450" fill="#ffffff"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="720" height="30" fill="#f2f2ef"/>
  <circle cx="18" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="34" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="50" cy="15" r="4.5" fill="#d8d8d2"/>
  <text class="t lbl" x="360" y="19" text-anchor="middle" font-size="10">Q3 Review - PowerPoint</text>
  <line x1="0" y1="30" x2="720" y2="30" stroke="#e3e3df"/>

  <!-- tab row -->
  <rect x="0" y="30" width="720" height="34" fill="#fbfbf9"/>
  <text class="t tab"    x="24"  y="51">File</text>
  <text class="t tab"    x="68"  y="51">Home</text>
  <text class="t tab"    x="118" y="51">Insert</text>
  <text class="t tab"    x="170" y="51">Design</text>
  <text class="t tab"    x="230" y="51">Transitions</text>
  <text class="t tab"    x="314" y="51">Animations</text>
  <text class="t tab"    x="398" y="51">Slide Show</text>
  <text class="t tab"    x="478" y="51">Review</text>
  <text class="t tab"    x="536" y="51">View</text>
  <text class="t tab-on" x="586" y="51">Notes Master</text>
  <rect x="582" y="60" width="84" height="3" rx="1.5" fill="#c43e1c"/>
  <line x1="0" y1="64" x2="720" y2="64" stroke="#e3e3df"/>

  <!-- ribbon -->
  <rect x="0" y="64" width="720" height="82" fill="#ffffff"/>

  <rect class="btn" x="24"  y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="70"  y="74" width="38" height="28" rx="4"/>
  <rect class="bar" x="24"  y="108" width="84" height="6" rx="3"/>
  <text class="t grp" x="24" y="134">SLIDE IMAGE</text>
  <line x1="120" y1="72" x2="120" y2="140" stroke="#e3e3df"/>

  <rect class="btn" x="136" y="74" width="34" height="28" rx="4"/>
  <rect class="btn" x="178" y="74" width="34" height="28" rx="4"/>
  <rect class="btn" x="220" y="74" width="34" height="28" rx="4"/>
  <rect class="btn" x="262" y="74" width="34" height="28" rx="4"/>
  <rect class="btn" x="304" y="74" width="34" height="28" rx="4"/>
  <rect class="bar" x="136" y="108" width="202" height="6" rx="3"/>
  <text class="t grp" x="136" y="134">PLACEHOLDERS</text>
  <line x1="352" y1="72" x2="352" y2="140" stroke="#e3e3df"/>

  <rect class="btn" x="368" y="74" width="34" height="28" rx="4"/>
  <rect class="bar" x="368" y="108" width="76" height="6" rx="3"/>
  <text class="t grp" x="368" y="134">EDIT THEME</text>

  <!-- close master view -->
  <rect x="596" y="72" width="104" height="34" rx="4" fill="#fdf0ec" stroke="#c43e1c" stroke-width="1.2"/>
  <text class="t cap" x="648" y="87" text-anchor="middle" fill="#c43e1c" font-weight="600">Close</text>
  <text class="t cap" x="648" y="99" text-anchor="middle" fill="#c43e1c" font-weight="600">Master View</text>

  <!-- page -->
  <rect x="196" y="164" width="352" height="244" fill="#d9d9d3"/>
  <rect x="190" y="158" width="352" height="244" fill="#ffffff" stroke="#dfdfd8"/>

  <!-- slide placeholder -->
  <rect x="220" y="178" width="292" height="132" fill="#fbfbf9" stroke="#dfdfd8" stroke-dasharray="4 3"/>
  <text class="t cap" x="366" y="248" text-anchor="middle" fill="#a8a8a0">Slide image</text>

  <!-- selected body placeholder -->
  <rect x="220" y="326" width="292" height="60" fill="#ffffff" stroke="#c43e1c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="t cap" x="232" y="348" fill="#a8a8a0">Click to edit Master text styles</text>
  <text class="t cap" x="232" y="364" fill="#a8a8a0">Second level &#183; Third level</text>

  <!-- selection handles -->
  <rect x="216" y="322" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="362" y="322" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="508" y="322" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="216" y="351" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="508" y="351" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="216" y="381" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="362" y="381" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>
  <rect x="508" y="381" width="9" height="9" fill="#ffffff" stroke="#c43e1c" stroke-width="1.3"/>

  <!-- callout -->
  <line x1="521" y1="356" x2="548" y2="356" stroke="#c43e1c" stroke-width="1.3"/>
  <text class="t grp" x="556" y="353">BODY TEXT</text>
  <text class="t grp" x="556" y="367">PLACEHOLDER</text>

  <!-- status bar -->
  <rect x="0" y="412" width="720" height="28" fill="#fbfbf9"/>
  <line x1="0" y1="412" x2="720" y2="412" stroke="#e3e3df"/>
  <text class="t cap" x="24" y="430" fill="#8a8a82">Notes Master</text>
  <rect class="btn" x="520" y="419" width="18" height="14" rx="2"/>
  <rect class="btn" x="544" y="419" width="18" height="14" rx="2"/>
  <rect class="btn" x="568" y="419" width="18" height="14" rx="2"/>
  <line x1="612" y1="426" x2="648" y2="426" stroke="#d8d8d2" stroke-width="2"/>
  <circle cx="636" cy="426" r="5" fill="#ffffff" stroke="#c43e1c" stroke-width="1.4"/>
  <text class="t cap" x="700" y="430" text-anchor="end" fill="#8a8a82">100%</text>
</svg>
