<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img">
  <title>Notes Page view: one printed page per slide, with the slide image at the top and the notes text below it</title>
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .lbl { font-size: 10px; fill: #8a8a82; letter-spacing: 0.06em; }
      .cap { font-size: 9px; fill: #5c5c5c; }
      .bar { fill: #eceae6; }
      .note { font-size: 11.5px; fill: #3a3a36; }
    </style>
  </defs>

  <rect width="720" height="430" fill="#efefec"/>

  <!-- paper -->
  <rect x="188" y="30" width="352" height="370" fill="#d9d9d3"/>
  <rect x="182" y="24" width="352" height="370" fill="#ffffff" stroke="#dfdfd8"/>

  <!-- slide image on the page -->
  <rect x="212" y="48" width="292" height="164" fill="#ffffff" stroke="#dfdfd8"/>
  <text class="t" x="234" y="96" font-size="13" fill="#3a3a36" font-weight="600">Three numbers</text>
  <line x1="234" y1="106" x2="278" y2="106" stroke="#c43e1c" stroke-width="2.5"/>
  <circle cx="239" cy="128" r="2.5" fill="#c43e1c"/>
  <rect class="bar" x="248" y="125" width="130" height="6" rx="3"/>
  <circle cx="239" cy="148" r="2.5" fill="#c43e1c"/>
  <rect class="bar" x="248" y="145" width="104" height="6" rx="3"/>
  <circle cx="239" cy="168" r="2.5" fill="#c43e1c"/>
  <rect class="bar" x="248" y="165" width="142" height="6" rx="3"/>

  <!-- chart on the slide -->
  <rect x="410" y="150" width="17" height="29" fill="#e6e6e1"/>
  <rect x="431" y="133" width="17" height="46" fill="#e6e6e1"/>
  <rect x="452" y="115" width="17" height="64" fill="#c43e1c"/>
  <line x1="407" y1="180" x2="472" y2="180" stroke="#dfdfd8"/>

  <!-- notes text on the page -->
  <text class="t note" x="212" y="246">3 numbers, then the ask.</text>
  <text class="t note" x="212" y="263">Revenue up <tspan font-weight="700">42</tspan> percent — say forty-two.</text>
  <text class="t note" x="212" y="280">Pause here. Let this one land.</text>
  <text class="t note" x="212" y="297">Next: cost, and why it is the smaller half.</text>
  <text class="t note" x="212" y="314" font-weight="700">ASK: pilot by February.</text>
  <text class="t note" x="212" y="331">If headcount comes up, park it for Q&amp;A.</text>

  <!-- slide number footer -->
  <text class="t cap" x="386" y="378" text-anchor="middle" fill="#a8a8a0">2</text>

  <!-- callouts -->
  <text class="t lbl" x="550" y="70">SLIDE IMAGE</text>
  <line x1="506" y1="66" x2="542" y2="66" stroke="#c43e1c" stroke-width="1.2"/>
  <text class="t lbl" x="550" y="262">NOTES TEXT</text>
  <line x1="506" y1="258" x2="542" y2="258" stroke="#c43e1c" stroke-width="1.2"/>
</svg>
