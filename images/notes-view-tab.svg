<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img">
  <title>The View tab with the Notes button highlighted in the Show group, plus the Notes button on the status bar</title>
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .tab { font-size: 12px; fill: #8a8a82; }
      .tab-on { font-size: 12px; fill: #c43e1c; font-weight: 600; }
      .lbl { font-size: 11px; fill: #5c5c5c; }
      .grp { font-size: 9.5px; fill: #9a9a92; letter-spacing: 0.04em; }
      .btn { fill: #f4f4f1; stroke: #e3e3df; }
      .bar { fill: #eceae6; }
      .cap { font-size: 9px; fill: #5c5c5c; }
    </style>
  </defs>

  <rect width="720" height="222" fill="#ffffff"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="720" height="30" fill="#f2f2ef"/>
  <circle cx="18" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="34" cy="15" r="4.5" fill="#d8d8d2"/>
  <circle cx="50" cy="15" r="4.5" fill="#d8d8d2"/>
  <text class="t lbl" x="360" y="19" text-anchor="middle" font-size="10">Q3 Review - PowerPoint</text>
  <line x1="0" y1="30" x2="720" y2="30" stroke="#e3e3df"/>

  <!-- tab row -->
  <rect x="0" y="30" width="720" height="34" fill="#fbfbf9"/>
  <text class="t tab"    x="24"  y="51">File</text>
  <text class="t tab"    x="74"  y="51">Home</text>
  <text class="t tab"    x="130" y="51">Insert</text>
  <text class="t tab"    x="186" y="51">Draw</text>
  <text class="t tab"    x="238" y="51">Design</text>
  <text class="t tab"    x="302" y="51">Transitions</text>
  <text class="t tab"    x="390" y="51">Animations</text>
  <text class="t tab"    x="478" y="51">Slide Show</text>
  <text class="t tab"    x="566" y="51">Review</text>
  <text class="t tab-on" x="632" y="51">View</text>
  <rect x="628" y="60" width="40" height="3" rx="1.5" fill="#c43e1c"/>
  <line x1="0" y1="64" x2="720" y2="64" stroke="#e3e3df"/>

  <!-- ribbon -->
  <rect x="0" y="64" width="720" height="86" fill="#ffffff"/>

  <!-- group: Presentation Views -->
  <rect class="btn" x="24"  y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="70"  y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="116" y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="162" y="74" width="38" height="28" rx="4"/>
  <rect class="bar" x="24"  y="106" width="38" height="6" rx="3"/>
  <rect class="bar" x="70"  y="106" width="38" height="6" rx="3"/>
  <rect class="bar" x="116" y="106" width="38" height="6" rx="3"/>
  <rect class="bar" x="162" y="106" width="38" height="6" rx="3"/>
  <text class="t grp" x="24" y="132">PRESENTATION VIEWS</text>
  <line x1="212" y1="72" x2="212" y2="134" stroke="#e3e3df"/>

  <!-- group: Master Views -->
  <rect class="btn" x="228" y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="274" y="74" width="38" height="28" rx="4"/>
  <rect class="btn" x="320" y="74" width="38" height="28" rx="4"/>
  <rect class="bar" x="228" y="106" width="38" height="6" rx="3"/>
  <rect class="bar" x="274" y="106" width="38" height="6" rx="3"/>
  <rect class="bar" x="320" y="106" width="38" height="6" rx="3"/>
  <text class="t grp" x="228" y="132">MASTER VIEWS</text>
  <line x1="370" y1="72" x2="370" y2="134" stroke="#e3e3df"/>

  <!-- group: Show  (the target) -->
  <text class="t grp" x="384" y="132">SHOW</text>
  <rect class="btn" x="384" y="74" width="40" height="28" rx="4"/>
  <rect class="btn" x="432" y="74" width="40" height="28" rx="4"/>
  <rect class="btn" x="480" y="74" width="40" height="28" rx="4"/>
  <text class="t cap" x="404" y="112" text-anchor="middle">Ruler</text>
  <text class="t cap" x="452" y="112" text-anchor="middle">Gridlines</text>
  <text class="t cap" x="500" y="112" text-anchor="middle">Guides</text>

  <!-- highlighted Notes button -->
  <rect x="528" y="68" width="62" height="48" rx="6" fill="#fdf0ec" stroke="#c43e1c" stroke-width="1.2"/>
  <rect x="538" y="74" width="42" height="28" rx="4" fill="#ffffff" stroke="#c43e1c"/>
  <line x1="544" y1="86" x2="574" y2="86" stroke="#c43e1c" stroke-width="1.4"/>
  <line x1="544" y1="91" x2="568" y2="91" stroke="#c43e1c" stroke-width="1.4"/>
  <line x1="544" y1="96" x2="572" y2="96" stroke="#c43e1c" stroke-width="1.4"/>
  <text class="t cap" x="559" y="112" text-anchor="middle" fill="#c43e1c" font-weight="600">Notes</text>

  <rect x="0" y="150" width="720" height="28" fill="#fbfbf9"/>
  <line x1="0" y1="150" x2="720" y2="150" stroke="#e3e3df"/>
  <text class="t cap" x="24" y="168" fill="#8a8a82">Slide 2 of 3</text>

  <!-- view buttons on the status bar -->
  <rect class="btn" x="520" y="157" width="18" height="14" rx="2"/>
  <rect class="btn" x="544" y="157" width="18" height="14" rx="2"/>
  <rect class="btn" x="568" y="157" width="18" height="14" rx="2"/>

  <!-- status-bar Notes button, also highlighted -->
  <rect x="600" y="152" width="58" height="24" rx="4" fill="#fdf0ec" stroke="#c43e1c" stroke-width="1.2"/>
  <text class="t cap" x="629" y="168" text-anchor="middle" fill="#c43e1c" font-weight="600">Notes</text>

  <!-- zoom -->
  <line x1="676" y1="164" x2="706" y2="164" stroke="#d8d8d2" stroke-width="2"/>
  <circle cx="694" cy="164" r="5" fill="#ffffff" stroke="#c43e1c" stroke-width="1.4"/>

  <!-- caption -->
  <rect x="24" y="188" width="672" height="26" rx="6" fill="#fdf0ec"/>
  <text class="t" x="360" y="205" text-anchor="middle" font-size="11.5" fill="#c43e1c">
    Two ways in: View → Notes on the ribbon, or the Notes button on the status bar.
  </text>
</svg>
