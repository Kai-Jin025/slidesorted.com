<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img">
  <title>Presenter View shows the audience only the slide, while the presenter sees the slide, speaker notes and a preview of the next slide</title>
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .cap  { font-size: 10px; fill: #9a9a92; letter-spacing: 0.10em; }
      .lbl  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .tiny { font-size: 9.5px; fill: #a0a099; }
      .note { font-size: 10px; fill: #6a6a62; }
    </style>
  </defs>

  <rect width="720" height="310" fill="#ffffff"/>
  <text class="t cap" x="360" y="26" text-anchor="middle">SLIDE SHOW → PRESENTER VIEW</text>

  <!-- ================= AUDIENCE ================= -->
  <text class="t lbl" x="179" y="58" text-anchor="middle">The audience sees</text>

  <rect x="24" y="72" width="310" height="200" rx="12" fill="#f5f5f2" stroke="#e3e3df" stroke-width="1.5"/>
  <!-- stand -->
  <rect x="163" y="272" width="32" height="12" fill="#e3e3df"/>
  <rect x="131" y="284" width="96" height="6" rx="3" fill="#e3e3df"/>

  <!-- the slide -->
  <rect x="74" y="109" width="210" height="118" rx="4" fill="#ffffff" stroke="#d8d8d2"/>
  <rect x="94" y="129" width="118" height="11" rx="3" fill="#c43e1c" opacity="0.75"/>
  <rect x="94" y="152" width="170" height="6" rx="3" fill="#e8e6e1"/>
  <rect x="94" y="166" width="170" height="6" rx="3" fill="#e8e6e1"/>
  <rect x="94" y="180" width="132" height="6" rx="3" fill="#e8e6e1"/>
  <rect x="94" y="200" width="76" height="14" rx="7" fill="#f0eeea"/>

  <text class="t note" x="179" y="252" text-anchor="middle">Just the slide. No notes, no timer.</text>

  <!-- ================= PRESENTER ================= -->
  <text class="t lbl" x="541" y="58" text-anchor="middle">You see</text>

  <rect x="386" y="72" width="310" height="200" rx="12" fill="#fbfbf9" stroke="#c43e1c" stroke-width="1.5"/>

  <!-- current slide -->
  <rect x="402" y="88" width="160" height="90" rx="4" fill="#ffffff" stroke="#d8d8d2"/>
  <rect x="414" y="100" width="88" height="9" rx="3" fill="#c43e1c" opacity="0.75"/>
  <rect x="414" y="117" width="134" height="5" rx="2.5" fill="#e8e6e1"/>
  <rect x="414" y="128" width="134" height="5" rx="2.5" fill="#e8e6e1"/>
  <rect x="414" y="139" width="102" height="5" rx="2.5" fill="#e8e6e1"/>
  <rect x="414" y="156" width="52" height="12" rx="6" fill="#f0eeea"/>
  <text class="t tiny" x="482" y="192" text-anchor="middle">current slide</text>

  <!-- next slide preview -->
  <rect x="578" y="88" width="102" height="60" rx="4" fill="#ffffff" stroke="#d8d8d2" stroke-dasharray="3 3"/>
  <rect x="588" y="98" width="48" height="6" rx="3" fill="#dcdad4"/>
  <rect x="588" y="110" width="82" height="4" rx="2" fill="#ebe9e4"/>
  <rect x="588" y="120" width="82" height="4" rx="2" fill="#ebe9e4"/>
  <text class="t tiny" x="629" y="162" text-anchor="middle">next slide</text>

  <!-- notes area -->
  <rect x="402" y="204" width="278" height="52" rx="5" fill="#fdf0ec" stroke="#eed3c6"/>
  <text class="t tiny" x="414" y="220" fill="#a3553a" font-weight="700">YOUR SPEAKER NOTES</text>
  <rect x="414" y="228" width="230" height="5" rx="2.5" fill="#e8cfc2"/>
  <rect x="414" y="239" width="188" height="5" rx="2.5" fill="#e8cfc2"/>

  <!-- legend -->
  <rect x="24" y="236" width="0" height="0"/>
  <text class="t note" x="541" y="288" text-anchor="middle">Only this screen shows notes — the projector never does.</text>
</svg>
