<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img">
  <title>The order to search for an unsaved PowerPoint, from the most likely to succeed to the last resort</title>
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .cap  { font-size: 10px; fill: #9a9a92; letter-spacing: 0.10em; }
      .step { font-size: 12.5px; font-weight: 600; fill: #1a1a1a; }
      .sub  { font-size: 10.5px; fill: #8a8a82; }
      .num  { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .tag  { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
    </style>
  </defs>

  <rect width="720" height="400" fill="#ffffff"/>
  <text class="t cap" x="360" y="24" text-anchor="middle">SEARCH IN THIS ORDER</text>

  <!-- stage labels -->
  <text class="t tag" x="700" y="60" text-anchor="end" fill="#2f6f4a">TRY FIRST</text>
  <text class="t tag" x="700" y="196" text-anchor="end" fill="#a3701f">THEN</text>
  <text class="t tag" x="700" y="332" text-anchor="end" fill="#a8431f">LAST RESORT</text>

  <!-- 1 -->
  <rect x="24" y="72" width="564" height="48" rx="7" fill="#f3f8f4" stroke="#cfe2d4"/>
  <circle cx="52" cy="96" r="13" fill="#2f6f4a"/>
  <text class="t num" x="52" y="100" text-anchor="middle">1</text>
  <text class="t step" x="78" y="92">Is PowerPoint still open?</text>
  <text class="t sub"  x="78" y="108">Save from there. Do not close it or restart the computer.</text>

  <!-- 2 -->
  <rect x="24" y="128" width="564" height="48" rx="7" fill="#f3f8f4" stroke="#cfe2d4"/>
  <circle cx="52" cy="152" r="13" fill="#2f6f4a"/>
  <text class="t num" x="52" y="156" text-anchor="middle">2</text>
  <text class="t step" x="78" y="148">File → Info → Manage Presentation</text>
  <text class="t sub"  x="78" y="164">then Recover Unsaved Presentations</text>

  <!-- 3 -->
  <rect x="24" y="184" width="564" height="48" rx="7" fill="#fdfaf2" stroke="#ecdcc0"/>
  <circle cx="52" cy="208" r="13" fill="#a3701f"/>
  <text class="t num" x="52" y="212" text-anchor="middle">3</text>
  <text class="t step" x="78" y="204">File → Options → Save</text>
  <text class="t sub"  x="78" y="220">Read the AutoRecover path, open it, sort by Date Modified.</text>

  <!-- 4 -->
  <rect x="24" y="240" width="564" height="48" rx="7" fill="#fdfaf2" stroke="#ecdcc0"/>
  <circle cx="52" cy="264" r="13" fill="#a3701f"/>
  <text class="t num" x="52" y="268" text-anchor="middle">4</text>
  <text class="t step" x="78" y="260">Won't open? Copy it and rename to .pptx</text>
  <text class="t sub"  x="78" y="276">AutoRecover files are often written with a .tmp extension.</text>

  <!-- 5 -->
  <rect x="24" y="296" width="564" height="48" rx="7" fill="#fdf5f2" stroke="#f0d5c6"/>
  <circle cx="52" cy="320" r="13" fill="#a8431f"/>
  <text class="t num" x="52" y="324" text-anchor="middle">5</text>
  <text class="t step" x="78" y="316">OneDrive or SharePoint version history</text>
  <text class="t sub"  x="78" y="332">The most reliable route — if the file was ever saved there.</text>

  <!-- 6 -->
  <rect x="24" y="352" width="564" height="40" rx="7" fill="#fdf5f2" stroke="#f0d5c6"/>
  <circle cx="52" cy="372" r="13" fill="#a8431f"/>
  <text class="t num" x="52" y="376" text-anchor="middle">6</text>
  <text class="t step" x="78" y="370">Recycle Bin, and File → Open → Recent</text>

  <!-- likelihood arrow -->
  <path d="M608 72 v312" stroke="#e3e3df" stroke-width="1.6"/>
  <path d="M608 384 l-5 -10 l10 0 z" fill="#e3e3df"/>
  <text class="t sub" x="622" y="232" font-size="10">likelihood</text>
  <text class="t sub" x="622" y="246" font-size="10">falls as you</text>
  <text class="t sub" x="622" y="260" font-size="10">go down</text>
</svg>
