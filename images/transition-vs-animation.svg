<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img">
  <title>Where a transition stops and an animation starts: a transition runs between two slides and is stored on the slide you arrive at, while an animation changes something inside a single slide</title>
  <defs>
    <style>
      .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .cap    { font-size: 10px; fill: #9a9a92; letter-spacing: 0.10em; }
      .name   { font-size: 13.5px; font-weight: 700; fill: #1a1a1a; }
      .hint   { font-size: 10.5px; fill: #8a8a82; }
      .num    { font-size: 15px; font-weight: 700; fill: #b8b8b0; }
      .own    { font-size: 10.5px; fill: #c43e1c; }
      .note   { font-size: 11.5px; fill: #5c5c5c; }
      .inbg   { font-size: 11px; fill: #7a7a72; }
      .inbl   { font-size: 11px; fill: #ffffff; font-weight: 600; }
      .arrow  { stroke: #c43e1c; stroke-width: 1.6; fill: none; }
      .tick   { stroke: #e8c4b8; stroke-width: 1; fill: none; }
    </style>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c43e1c"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#ffffff"/>
  <text class="t cap" x="360" y="26" text-anchor="middle">TRANSITIONS BETWEEN SLIDES &#183; ANIMATIONS INSIDE ONE</text>

  <!-- ================= row 1: transitions ================= -->
  <text class="t name" x="24" y="86">Between slides</text>
  <text class="t hint" x="24" y="104">the slide changes</text>

  <rect x="186" y="58" width="104" height="68" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <text class="t num" x="238" y="100" text-anchor="middle">1</text>

  <rect x="352" y="58" width="104" height="68" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <text class="t num" x="404" y="100" text-anchor="middle">2</text>

  <rect x="518" y="58" width="104" height="68" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <text class="t num" x="570" y="100" text-anchor="middle">3</text>

  <line class="arrow" x1="294" y1="92" x2="344" y2="92" marker-end="url(#head)"/>
  <line class="arrow" x1="460" y1="92" x2="510" y2="92" marker-end="url(#head)"/>

  <line class="tick" x1="321" y1="100" x2="321" y2="130"/>
  <line class="tick" x1="487" y1="100" x2="487" y2="130"/>
  <text class="t own" x="321" y="143" text-anchor="middle">stored on slide 2</text>
  <text class="t own" x="487" y="143" text-anchor="middle">stored on slide 3</text>

  <line x1="24" y1="168" x2="696" y2="168" stroke="#f0f0ec"/>

  <!-- ================= row 2: animations ================= -->
  <text class="t name" x="24" y="212">Inside a slide</text>
  <text class="t hint" x="24" y="230">the slide stays</text>

  <rect x="186" y="178" width="436" height="104" rx="6" fill="#fafaf8" stroke="#eeeeea"/>
  <text class="t cap" x="200" y="198">SLIDE 2</text>

  <rect x="214" y="216" width="112" height="44" rx="5" fill="#e6e4de"/>
  <text class="t inbg" x="270" y="243" text-anchor="middle">object</text>

  <line class="arrow" x1="338" y1="238" x2="392" y2="238" marker-end="url(#head)"/>
  <text class="t hint" x="366" y="228" text-anchor="middle" fill="#c43e1c">animation</text>

  <rect x="408" y="216" width="112" height="44" rx="5" fill="#c43e1c"/>
  <text class="t inbl" x="464" y="243" text-anchor="middle">object</text>

  <text class="t note" x="186" y="312">A transition moves you between slides. An animation changes what is on one.</text>
</svg>
