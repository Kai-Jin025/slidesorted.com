<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple touch icon source — render to images/apple-touch-icon.png</title>
<style>
  /* iOS rounds the corners itself and does not want transparency, so this is a
     full-bleed square rather than the rounded tile the SVG favicon uses. */
  html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; }
  body { background: #c43e1c; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" width="112" height="112" aria-hidden="true">
    <rect x="5" y="9.5" width="22" height="13" rx="2" fill="#ffffff"/>
    <rect x="8.2" y="12.6" width="9" height="1.9" rx="0.95" fill="#c43e1c"/>
    <rect x="8.2" y="16.6" width="14.6" height="1.9" rx="0.95" fill="#c43e1c" opacity="0.45"/>
  </svg>
</body>
</html>
