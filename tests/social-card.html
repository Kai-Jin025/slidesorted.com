<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social card source — render to images/social-card.png</title>
<style>
  /* Rendered by headless Chrome at exactly 1200x630. See README.
     Edit here, re-render, commit the PNG. Do not deploy this file. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    padding: 0 84px 0 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .rule { position: absolute; inset: 0 0 auto 0; height: 11px; background: #c43e1c; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: #8a8a82; margin-bottom: 30px;
  }
  .brand { font-size: 104px; font-weight: 700; letter-spacing: -.035em; line-height: .95; }
  .brand span { color: #c43e1c; }
  .lede {
    margin-top: 38px; font-size: 31px; line-height: 1.42;
    color: #4a4a46; max-width: 950px;
  }
  .foot {
    margin-top: 56px; display: flex; align-items: center; gap: 16px;
    font-size: 21px; color: #8a8a82;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #cdcdc6; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="eyebrow">PowerPoint guides &amp; tools</div>
  <div class="brand">Slide<span>Sorted</span></div>
  <p class="lede">Clear answers for the things that actually go wrong —<br>file sizes, transitions, slide masters, recovery.</p>
  <div class="foot">
    <span>Free</span><i class="dot"></i>
    <span>No signup</span><i class="dot"></i>
    <span>A .pptx checker that never uploads your file</span>
  </div>
</body>
</html>
